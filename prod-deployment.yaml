apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-iac-ci-cd-project
  namespace: prod
spec:
  replicas: 4   # Production runs multiple replicas for HA
  selector:
    matchLabels:
      app: eks-iac-ci-cd-project
  template:
    metadata:
      labels:
        app: eks-iac-ci-cd-project
    spec:
      containers:
        - name: eks-iac-ci-cd-project-container
          image: 454331167189.dkr.ecr.us-east-1.amazonaws.com/eks-iac-ci-cd-project:latest
          ports:
            - containerPort: 81
          env:
            - name: ENV
              value: "prod"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
